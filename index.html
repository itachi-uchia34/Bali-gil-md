<style>
  :root{
    --bg:#080a16;
    --bg-panel:rgba(15,18,36,0.76);
    --bg-panel-2:rgba(20,22,46,0.92);
    --grid:rgba(124,140,255,0.11);
    --red:#ff5574;
    --red-bright:#ff8ca2;
    --red-dim:#a42b52;
    --red-deep:#32132d;
    --cloud:#f7f5ff;
    --red-glass:rgba(255,85,116,0.12);
    --border:rgba(187,195,255,0.2);
    --text:#f7f8ff;
    --muted:#a7afd0;
    --amber:#f7c768;
    --danger:#ff718d;
    --violet:#8b7dff;
    --cyan:#68dcff;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(104,220,255,.13), transparent 28%),
      radial-gradient(circle at 88% 18%, rgba(139,125,255,.16), transparent 30%),
      linear-gradient(145deg, #070814 0%, #0d1024 48%, #150b20 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    min-height:100vh;
    line-height:1.6;
    position:relative;
    overflow-x:hidden;
  }

  .grid-bg{
    position:fixed;inset:0;z-index:-3;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(ellipse 80% 70% at 50% 20%,#000 40%,transparent 100%);
  }
  .glow-orb{
    position:fixed;top:-10%;left:50%;transform:translateX(-50%);
    width:60vw;height:60vw;max-width:900px;max-height:900px;
    background:radial-gradient(circle,rgba(255,0,0,0.10) 0%,transparent 65%);
    filter:blur(40px);z-index:-2;pointer-events:none;
    animation:orbPulse 8s ease-in-out infinite alternate;
  }
  @keyframes orbPulse{0%{opacity:.5;}100%{opacity:1;}}
  .scanlines{
    position:fixed;inset:0;z-index:50;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0.15) 0px,rgba(0,0,0,0.15) 1px,transparent 2px,transparent 3px);
    opacity:.35;
  }
  .particles{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
  .particle{position:absolute;background:var(--red);border-radius:50%;opacity:0;animation:drift linear infinite;box-shadow:0 0 6px var(--red);}
  @keyframes drift{0%{transform:translateY(100vh);opacity:0;}10%{opacity:.7;}90%{opacity:.4;}100%{transform:translateY(-10vh);opacity:0;}}

  #boot{
    position:fixed;inset:0;z-index:999;background:#010301;
    display:flex;align-items:center;justify-content:center;
    font-family:'Share Tech Mono',monospace;
  }
  #boot pre{color:var(--red);font-size:.85rem;white-space:pre-wrap;max-width:600px;padding:20px;text-shadow:0 0 8px rgba(255,0,0,.5);}
  #boot .cursor{display:inline-block;width:8px;height:16px;background:var(--red);animation:blink 1s step-end infinite;vertical-align:middle;}
  @keyframes blink{50%{opacity:0;}}
  #boot.hide{animation:bootOut .5s ease forwards;}
  @keyframes bootOut{to{opacity:0;visibility:hidden;}}

  #boot{background:radial-gradient(circle at 50% 42%,#3f0817 0%,#13060d 34%,#070509 75%);overflow:hidden;perspective:1000px;}
  #boot::before,#boot::after{content:'';position:absolute;width:65vmax;height:65vmax;border-radius:50%;border:1px solid rgba(255,76,104,.12);box-shadow:0 0 80px rgba(226,27,60,.12) inset;transform:translateZ(-180px);}
  #boot::before{top:-36vmax;left:-22vmax;}
  #boot::after{right:-25vmax;bottom:-43vmax;}
  .boot-scene{position:relative;width:min(390px,88vw);min-height:410px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-style:preserve-3d;animation:sceneFloat 5s ease-in-out infinite;}
  .boot-cloud{position:absolute;width:160px;height:58px;border:3px solid var(--cloud);border-radius:50%;opacity:.76;filter:drop-shadow(0 0 14px rgba(255,76,104,.42));transform-style:preserve-3d;}
  .boot-cloud::before,.boot-cloud::after{content:'';position:absolute;border:3px solid var(--cloud);border-radius:50%;background:rgba(35,5,15,.24);}
  .boot-cloud::before{width:60px;height:60px;left:25px;top:-33px;}
  .boot-cloud::after{width:80px;height:80px;right:21px;top:-45px;}
  .cloud-one{top:34px;left:-54px;transform:rotate(-12deg) translateZ(-90px);animation:cloudDrift 8s ease-in-out infinite alternate;}
  .cloud-two{right:-66px;bottom:90px;transform:rotate(11deg) translateZ(-120px) scale(.82);opacity:.42;animation:cloudDrift 9s ease-in-out -2s infinite alternate-reverse;}
  .loader-planet{position:relative;width:174px;height:174px;display:grid;place-items:center;transform-style:preserve-3d;}
  .loader-core{position:absolute;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffced6 0%,#ff5970 12%,#df193b 40%,#650816 72%,#19040a 100%);box-shadow:0 0 20px rgba(255,76,104,.96),0 0 68px rgba(226,27,60,.54),inset -12px -16px 20px rgba(0,0,0,.45);transform:translateZ(28px);animation:corePulse 1.8s ease-in-out infinite;}
  .loader-core::before{content:'';position:absolute;inset:17px;border:2px solid rgba(255,255,255,.62);border-radius:50%;box-shadow:0 0 10px rgba(255,255,255,.42);}
  .loader-ring{position:absolute;border:2px solid rgba(255,113,135,.74);border-radius:50%;transform-style:preserve-3d;box-shadow:0 0 16px rgba(226,27,60,.38),inset 0 0 13px rgba(226,27,60,.28);}
  .loader-ring::after{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:var(--cloud);box-shadow:0 0 13px var(--cloud);}
  .ring-one{width:152px;height:60px;transform:rotateX(68deg) rotateZ(-22deg);animation:ringOrbit 3.7s linear infinite;}
  .ring-one::after{top:-6px;left:30px;}
  .ring-two{width:162px;height:64px;transform:rotateY(66deg) rotateZ(28deg);animation:ringOrbit 4.8s linear -1.2s infinite reverse;}
  .ring-two::after{right:34px;bottom:-6px;}
  .ring-three{width:130px;height:130px;border-color:rgba(255,76,104,.34);transform:rotateX(70deg) rotateY(24deg);animation:ringTilt 5.5s ease-in-out infinite;}
  .loader-mark{position:relative;z-index:3;font-family:'Share Tech Mono',monospace;font-size:1.8rem;font-weight:700;color:var(--cloud);letter-spacing:.24em;transform:translateZ(58px);text-shadow:0 0 16px rgba(255,255,255,.72);}
  .boot-copy{position:relative;z-index:4;text-align:center;margin-top:28px;transform:translateZ(40px);}
  .boot-copy .boot-eyebrow{font-size:.65rem;letter-spacing:.34em;color:var(--red-bright);text-transform:uppercase;}
  .boot-copy h2{font-family:'Share Tech Mono',monospace;margin:9px 0 6px;font-size:1.1rem;letter-spacing:.13em;color:var(--cloud);}
  .boot-copy p{font-size:.72rem;color:var(--muted);letter-spacing:.08em;}
  .boot-progress{width:min(270px,70vw);height:4px;margin:21px auto 0;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;box-shadow:0 0 15px rgba(226,27,60,.2);}
  .boot-progress span{display:block;width:18%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--red),#ff9aaa,var(--cloud));box-shadow:0 0 16px var(--red-bright);transition:width .32s ease;}
  @keyframes sceneFloat{0%,100%{transform:rotateX(2deg) rotateY(-4deg) translateY(0);}50%{transform:rotateX(-2deg) rotateY(5deg) translateY(-10px);}}
  @keyframes cloudDrift{from{margin-left:-10px;opacity:.36;}to{margin-left:18px;opacity:.86;}}
  @keyframes corePulse{0%,100%{transform:translateZ(28px) scale(1);filter:saturate(1);}50%{transform:translateZ(38px) scale(1.13);filter:saturate(1.35);}}
  @keyframes ringOrbit{to{transform:rotateX(68deg) rotateZ(338deg);}}
  @keyframes ringTilt{0%,100%{transform:rotateX(70deg) rotateY(24deg) rotateZ(0);}50%{transform:rotateX(42deg) rotateY(-30deg) rotateZ(120deg);}}

  nav{box-shadow:0 12px 36px rgba(0,0,0,.26);}
  .brand .mark{border-radius:50%;width:44px;height:44px;color:var(--cloud);background:radial-gradient(circle at 32% 25%,var(--red-bright),var(--red-deep) 70%);border-color:rgba(255,165,178,.7);box-shadow:0 0 20px rgba(226,27,60,.52),inset -5px -7px 10px rgba(0,0,0,.38);}
  .brand .name{letter-spacing:.13em;font-family:'Share Tech Mono',monospace;color:var(--cloud);}
  .eyebrow{background:rgba(226,27,60,.13);box-shadow:0 8px 24px rgba(0,0,0,.22);}
  header h1{color:var(--cloud);text-shadow:0 0 6px rgba(255,255,255,.42),0 0 24px rgba(226,27,60,.64);}
  header h1 .glitch-wrap::before,header h1 .glitch-wrap::after{color:var(--red-bright);}
  .stat-card,section.panel{border-color:rgba(239,104,126,.3);box-shadow:0 18px 48px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.04);}
  section.panel::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.03),transparent 28%,rgba(226,27,60,.06));}
  .feature-item,.connect-card{background:linear-gradient(145deg,rgba(226,27,60,.09),rgba(8,5,10,.22));border-color:rgba(239,104,126,.24);}
  .feature-item:hover{box-shadow:0 16px 28px rgba(0,0,0,.24),0 0 22px rgba(226,27,60,.18);}
  .btn{background:linear-gradient(135deg,var(--red-bright),var(--red));color:var(--cloud);box-shadow:0 9px 20px rgba(117,7,28,.28);}
  .btn:hover{box-shadow:0 0 28px rgba(255,76,104,.5),0 12px 22px rgba(0,0,0,.28);}
  .btn-outline{color:var(--cloud);border-color:rgba(255,156,172,.62);background:rgba(226,27,60,.05);}
  .btn-outline:hover{background:rgba(226,27,60,.18);}
  .connection-chip{background:rgba(226,27,60,.1);border-color:rgba(255,156,172,.5);}
  .code-box{border-color:var(--red-bright);background:radial-gradient(circle at 50% 0,rgba(226,27,60,.18),rgba(0,0,0,.45) 70%);}
  footer{background:linear-gradient(180deg,transparent,rgba(16,5,12,.6));}
  @media (prefers-reduced-motion:reduce){.boot-scene,.boot-cloud,.loader-core,.loader-ring{animation:none!important;}}

  .modal{
    position:fixed;inset:0;background:rgba(1,4,1,.85);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;z-index:800;
    opacity:0;visibility:hidden;transition:.35s ease;
  }
  .modal.active{opacity:1;visibility:visible;}
  .modal-content{
    width:90%;max-width:460px;background:var(--bg-panel-2);
    border:1px solid var(--border);border-radius:var(--radius);
    transform:translateY(-30px);transition:transform .35s ease;
    box-shadow:0 0 60px rgba(255,0,0,.08),0 25px 50px rgba(0,0,0,.6);
  }
  .modal.active .modal-content{transform:translateY(0);}
  .modal-head{
    padding:20px 22px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h2{font-size:1rem;letter-spacing:1px;color:var(--red);font-weight:600;}
  .modal-head h2::before{content:"root@bali gil:~$ ";color:var(--muted);}
  .modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1;}
  .modal-close:hover{color:var(--red);}
  .modal-body p{color:var(--muted);font-size:.85rem;margin-bottom:16px;}
  .channel-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .channel-item{
    display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:rgba(255,0,0,.04);border:1px solid var(--border);border-radius:8px;
    text-decoration:none;color:var(--text);font-size:.82rem;transition:.25s;
  }
  .channel-item:hover{background:var(--red-glass);border-color:var(--red);transform:translateX(4px);}
  .channel-item i{color:var(--red);width:18px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--red);color:#01120a;font-weight:700;font-size:.82rem;
    letter-spacing:.5px;padding:13px 22px;border:none;border-radius:8px;
    cursor:pointer;text-decoration:none;width:100%;text-transform:uppercase;
    transition:.25s;position:relative;overflow:hidden;
  }
  .btn:hover{box-shadow:0 0 25px rgba(255,0,0,.45);transform:translateY(-2px);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-outline{background:transparent;color:var(--red);border:1px solid var(--border);}
  .btn-outline:hover{background:var(--red-glass);}

  nav{
    position:fixed;top:0;left:0;right:0;height:74px;z-index:200;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 32px;background:rgba(8,5,10,.88);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:40px;height:40px;border-radius:8px;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:'Share Tech Mono',monospace;font-size:1.2rem;color:var(--red);

  .brand .name{font-weight:700;font-size:1rem;letter-spacing:.5px;}

  .nav-links{display:flex;gap:28px;align-items:center;}

  .nav-links a::after{content:''; position:absolute; bottom:-5px; left:0; width:0; height:2px; background:var(--red); transition:.4s;}
  .nav-links a:hover{color:var(--red);}
  .nav-links a:hover::after{width:100%;}
  .nav-toggle{display:none;background:none;border:none;color:var(--red);font-size:1.3rem;cursor:pointer;}

  header{padding:150px 20px 70px;text-align:center;position:relative;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:.72rem;letter-spacing:3px;
    color:var(--muted);text-transform:uppercase;margin-bottom:22px;
    border:1px solid var(--border);padding:6px 14px;border-radius:30px;background:var(--red-glass);
  }
  .eyebrow .pulse{width:6px;height:6px;background:var(--red);border-radius:50%;box-shadow:0 0 8px var(--red);animation:blink 1.4s infinite;}
  header h1{
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(2.2rem,6vw,4.2rem);letter-spacing:2px;
    color:var(--red);text-shadow:0 0 18px rgba(255,0,0,.35);
    margin-bottom:18px;position:relative;display:inline-block;
  }
  header h1 .glitch-wrap{position:relative;display:inline-block;}
  header h1 .glitch-wrap::before,header h1 .glitch-wrap::after{
    content:attr(data-text);position:absolute;top:0;left:0;width:100%;
    overflow:hidden;color:var(--red);
  }
  header h1 .glitch-wrap::before{left:2px;text-shadow:-2px 0 var(--danger);animation:glitchTop 5s infinite linear alternate-reverse;clip-path:inset(0 0 55% 0);}
  header h1 .glitch-wrap::after{left:-2px;text-shadow:2px 0 var(--amber);animation:glitchBot 6s infinite linear alternate-reverse;clip-path:inset(55% 0 0 0);}
  @keyframes glitchTop{0%,90%,100%{transform:translate(0,0);}92%{transform:translate(-3px,-1px);}94%{transform:translate(3px,1px);}96%{transform:translate(-2px,0);}}
  @keyframes glitchBot{0%,90%,100%{transform:translate(0,0);}91%{transform:translate(2px,1px);}95%{transform:translate(-3px,-1px);}97%{transform:translate(2px,0);}}
  header p.sub{color:var(--muted);max-width:560px;margin:0 auto;font-size:.95rem;}
  header p.sub strong{color:var(--red);}
